# Linux only — linked as os.conf by install.sh and loaded from config.
# Mirror macOS, where cmd does copy/paste and ctrl goes to the shell:
# here ctrl does copy/paste and super takes over the control codes it displaced.
keybind = ctrl+c=copy_to_clipboard
keybind = ctrl+v=paste_from_clipboard
# super+c = interrupt (what ctrl+c normally sends, SIGINT)
keybind = super+c=text:\x03
# super+v = what ctrl+v normally sends (vim visual-block, shell quoted-insert)
keybind = super+v=text:\x16
