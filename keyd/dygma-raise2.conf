# Dygma Raise 2 only (USB id 35ef:0021); other keyboards are untouched.
#
# The keyboard's "macros" layer (thumb key + 1..9) sends Alt+F1..F9, which skhd
# binds to apps on macOS (skhd/skhdrc.symlink). On Linux, turn those into
# Super+1..9, which Cinnamon's panel uses to focus/launch pinned app N.
# Keep the panel's pin order in the same order as skhdrc.

[ids]
35ef:0021

[alt]
f1 = M-1
f2 = M-2
f3 = M-3
f4 = M-4
f5 = M-5
f6 = M-6
f7 = M-7
f8 = M-8
f9 = M-9
